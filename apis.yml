aid: idg-capital
name: IDG Capital
description: >-
  IDG Capital is a global investment firm founded in Boston in 1993 and
  headquartered in Hong Kong, widely recognized as one of the first foreign
  venture investors to enter China. Over more than 30 years it has grown into a
  multi-stage platform spanning venture capital, growth capital, buyout,
  secondary markets, and public markets, with reported assets under management
  of roughly $20–23 billion. The firm has backed 1,800+ companies and realized
  600+ exits, employing 300+ staff (about 40% investment professionals) across
  12 offices on three continents, including Hong Kong, Beijing, Shanghai,
  Shenzhen, Guangzhou, Singapore, Seoul, Boston, New York, Barcelona, Muscat,
  and the Cayman Islands. IDG Capital concentrates on Consumer, Consumer
  Technology, Healthcare, and Fintech/Web3, and its portfolio includes early
  bets on many of China's technology leaders — Tencent, Baidu, Xiaomi, Meituan,
  ByteDance, and Ctrip — alongside global names such as Coinbase, Circle,
  Farfetch, Moncler, Acne Studios, and Insta360.
